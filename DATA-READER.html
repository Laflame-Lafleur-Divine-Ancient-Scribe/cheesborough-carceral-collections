<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Spreadsheet Reader | The Cheesborough Carceral Collections</title>
<style>:root{--navy:#102c4c;--deep:#091e36;--gold:#c29b53;--paper:#f5f2eb;--line:#d7d0c3}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:#202020;font:15px/1.5 "Segoe UI",sans-serif}.topbar{background:var(--gold);color:#fff;display:flex;gap:1rem;padding:.75rem 1rem}.topbar a{color:#fff;text-decoration:none}.wrap{margin:auto;max-width:1200px;padding:2rem 1rem}h1{color:var(--navy);font:700 clamp(1.6rem,4vw,2.8rem)/1.1 Georgia,serif;margin:0 0 .5rem}.status{color:#625f59;margin:.4rem 0 1.2rem}.controls{align-items:center;display:flex;gap:.7rem;flex-wrap:wrap;margin-bottom:1rem}.controls label{color:var(--navy);font-weight:700}.controls select{border:1px solid #b8ab95;padding:.6rem;min-width:18rem}.controls a{background:var(--navy);color:#fff;display:inline-block;padding:.6rem .85rem;text-decoration:none}.table-wrap{background:#fff;border:1px solid var(--line);max-height:70vh;overflow:auto}.table-wrap table{border-collapse:collapse;min-width:100%;white-space:nowrap}.table-wrap th,.table-wrap td{border-bottom:1px solid #e5dfd5;border-right:1px solid #eee;padding:.55rem .7rem;text-align:left}.table-wrap th{background:#e9e1d6;color:var(--navy);position:sticky;top:0;z-index:1}.error{background:#fff1ed;border-left:4px solid #8f3d32;padding:1rem}.loading{color:var(--navy)}</style>
  <link rel="stylesheet" href="desktop-integrity.css">
    <script defer src="site-analytics.js"></script>
<script src="site-theme.js" defer></script>
<script src="community-auth.js" defer></script></head>
<body><nav class="topbar"><a href="index.html">Home</a><a href="SEARCH.html">Search</a><a href="EVIDENCE-INDEX.html">Evidence index</a><a href="AMERICAN-SIBERIA.html">Powell</a></nav><main class="wrap"><h1 id="title">Spreadsheet reader</h1><p id="status" class="status loading">Loading the original workbook...</p><div class="controls"><label for="sheet-select">View sheet</label><select id="sheet-select" aria-label="Choose worksheet" hidden></select><a id="download" hidden download>Download original workbook</a></div><div id="content" class="table-wrap"></div></main><script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script><script>
const params=new URLSearchParams(window.location.search);const file=params.get('file');const title=document.querySelector('#title');const status=document.querySelector('#status');const content=document.querySelector('#content');const download=document.querySelector('#download');const sheetSelect=document.querySelector('#sheet-select');let workbook;
function fileUrl(path){const normalized=decodeURIComponent(path.replaceAll('\\','/'));const encoded=normalized.split('/').map(part=>encodeURIComponent(part)).join('/');return new URL(encoded,document.baseURI).href}
function showError(message){status.className='status error';status.textContent=message}
function renderSheet(sheetName){const sheet=workbook.Sheets[sheetName];const rows=XLSX.utils.sheet_to_json(sheet,{header:1,defval:''});content.replaceChildren();const table=document.createElement('table');if(!rows.length){const empty=document.createElement('p');empty.textContent='This worksheet is empty.';content.append(empty);return}rows.forEach((row,index)=>{const tr=document.createElement('tr');row.forEach(cell=>{const element=document.createElement(index===0?'th':'td');element.textContent=cell;tr.append(element)});table.append(tr)});content.append(table);status.textContent=`${workbook.SheetNames.length} sheet${workbook.SheetNames.length===1?'':'s'} available. Showing ${sheetName}: ${Math.max(rows.length-1,0)} data rows.`}
if(!file){showError('No workbook was selected. Return to the evidence index and choose a spreadsheet.')}else{const source=fileUrl(file);const name=decodeURIComponent(file.replaceAll('\\','/').split('/').pop());title.textContent=name;download.href=source;download.hidden=false;fetch(source).then(response=>{if(!response.ok)throw new Error('Workbook could not be loaded');return response.arrayBuffer()}).then(buffer=>{workbook=XLSX.read(buffer,{type:'array'});sheetSelect.replaceChildren();workbook.SheetNames.forEach((sheetName,index)=>{const option=document.createElement('option');option.value=sheetName;option.textContent=sheetName;option.selected=index===0;sheetSelect.append(option)});sheetSelect.hidden=workbook.SheetNames.length<2;sheetSelect.addEventListener('change',()=>renderSheet(sheetSelect.value));renderSheet(workbook.SheetNames[0])}).catch(()=>showError('This workbook could not be rendered in the browser. Use Download original workbook to open it in Excel.'))}
</script><script src="title-case.js"></script></body></html>
