name: Deploy static site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          lfs: true

      - name: Verify source PDFs contain document data
        run: node scripts/verify-source-pdfs.cjs

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify account isolation
        run: |
          sudo apt-get update && sudo apt-get install -y poppler-utils
          npm ci --omit=dev
          npm install --prefix "$RUNNER_TEMP/membership-tests" --no-save @electric-sql/pglite@0.5.8
          PGLITE_MODULE_PATH="$RUNNER_TEMP/membership-tests/node_modules/@electric-sql/pglite" node --test scripts/test-account-email.cjs scripts/test-owner-analytics.cjs scripts/test-pdf-access.cjs

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Add lightweight public analytics collection
        run: node scripts/prepare-analytics.cjs

      - name: Stage public files without backend or private sources
        run: node scripts/prepare-public-site.cjs

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Verify PDF backend before switching the public reader
        run: node scripts/wait-for-pdf-backend.cjs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
