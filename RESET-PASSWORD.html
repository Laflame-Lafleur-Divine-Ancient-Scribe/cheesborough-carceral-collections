<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><meta name="robots" content="noindex"><title>Reset Your Password | Carceral Collections</title><link rel="stylesheet" href="account-services.css"><script defer src="password-reset.js"></script></head>
<body><header><a href="index.html">Cheesborough Carceral Collections</a><a href="LOGIN.html">Sign In</a></header><main><p class="eyebrow">Your Account</p><h1>Reset Your Password</h1><p id="intro">Enter your account email and we’ll send you a secure link to choose a new password.</p>
<form id="reset-request"><label>Email Address<input name="email" type="email" autocomplete="email" maxlength="254" required></label><button>Send Reset Link</button></form>
<form id="reset-password" hidden><label>New Password<input name="password" type="password" autocomplete="new-password" minlength="10" maxlength="128" required></label><label>Confirm New Password<input name="confirm" type="password" autocomplete="new-password" minlength="10" maxlength="128" required></label><p>Use 10–128 characters. This will sign you out of your other sessions.</p><button>Save New Password</button></form>
<p id="status" role="status" aria-live="polite"></p><p><a href="LOGIN.html">Return to Sign In</a></p></main></body></html>
