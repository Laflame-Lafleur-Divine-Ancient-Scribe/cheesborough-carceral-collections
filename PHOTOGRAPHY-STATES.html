<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Photography by State</title>
    <style>
      :root { --ink: #14283d; --gold: #c29b53; --paper: #f4f0e8; --muted: #68747d; }
      * { box-sizing: border-box; }
      body { background: var(--paper); color: var(--ink); font: 16px Arial, sans-serif; margin: 0; }
      a { color: inherit; text-decoration: none; }
      .nav { align-items: center; background: var(--ink); color: #fff; display: flex; justify-content: space-between; padding: 0.8rem max(1rem, calc((100% - 1100px) / 2)); }
      .nav-links { display: flex; gap: 1rem; }
      .nav a:hover { color: var(--gold); }
      .hero { background: linear-gradient(120deg, #102c4c 35%, #283f51); color: #fff; padding: clamp(2.5rem, 5vw, 5rem) max(1rem, calc((100% - 1100px) / 2)); }
      .eyebrow { color: var(--gold); font-size: 0.78rem; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; }
      h1 { font-family: "Libre Baskerville", Georgia, serif; font-size: clamp(2.2rem, 4.5vw, 3.8rem); font-weight: 700; line-height: 1.18; letter-spacing: -0.01em; margin: 0.7rem 0; text-wrap: balance; }
      .hero p { color: #d8e0e5; font-size: clamp(1rem, 0.3vw + 0.9rem, 1.15rem); line-height: 1.6; margin: 0; max-width: 42rem; }
      .content { margin: auto; max-width: 1100px; padding: 2rem 1rem 4rem; }
      .controls { align-items: center; display: flex; flex-wrap: wrap; gap: 0.75rem; justify-content: space-between; margin-bottom: 1.5rem; }
      .controls input { background: #fff; border: 1px solid #b8b1a6; min-width: min(22rem, 100%); padding: 0.8rem; }
      .count { color: var(--muted); font-size: 0.9rem; }
      .states { display: grid; gap: 0.75rem; grid-template-columns: repeat(4, 1fr); }
      .state { background: #fff; border: 1px solid #d5cec2; min-height: 7rem; padding: 1rem; transition: border-color 0.2s, transform 0.2s; }
      .state:hover { border-color: var(--gold); transform: translateY(-3px); }
      .state strong { color: var(--ink); display: block; font: 700 1.1rem Georgia, serif; }
      .state span { color: var(--muted); display: block; font-size: 0.82rem; margin-top: 0.65rem; }
      .state[hidden] { display: none; }
      .empty { color: var(--muted); grid-column: 1 / -1; text-align: center; }
      @media (max-width: 760px) { .states { grid-template-columns: repeat(2, 1fr); } }
      @media (max-width: 470px) { .states { grid-template-columns: 1fr; } .nav { align-items: flex-start; flex-direction: column; gap: 0.7rem; } }
    </style>
  </head>
  <body>
    <nav class="nav">
      <a href="DIGITAL-PHOTOGRAPHY-COLLECTIONS.html">CCC / PHOTOGRAPHY</a>
      <div class="nav-links"><a href="index2.html">Home</a><a href="SEARCH.html">Search</a><a href="COLLECTIONS.html">Collections</a><a href="DONATE.html">Donate</a></div>
    </nav>
    <header class="hero">
      <div class="eyebrow">State index / 50 jurisdictions</div>
      <h1 id="collection-title">Photography Collection</h1>
      <p>Choose a state to organize this photograph collection by place. Each state index is designed to hold finding aids, image records, and related materials.</p>
    </header>
    <main class="content">
      <div class="controls"><input id="state-search" type="search" placeholder="Search states..." aria-label="Search states" /><span class="count" id="count"></span></div>
      <section class="states" id="states" aria-label="All 50 states"></section>
    </main>
    <script>
      const states = ["Alabama", "Alaska", "Arizona", "Arkansas", "California", "Colorado", "Connecticut", "Delaware", "Florida", "Georgia", "Hawaii", "Idaho", "Illinois", "Indiana", "Iowa", "Kansas", "Kentucky", "Louisiana", "Maine", "Maryland", "Massachusetts", "Michigan", "Minnesota", "Mississippi", "Missouri", "Montana", "Nebraska", "Nevada", "New Hampshire", "New Jersey", "New Mexico", "New York", "North Carolina", "North Dakota", "Ohio", "Oklahoma", "Oregon", "Pennsylvania", "Rhode Island", "South Carolina", "South Dakota", "Tennessee", "Texas", "Utah", "Vermont", "Virginia", "Washington", "West Virginia", "Wisconsin", "Wyoming"];
      const params = new URLSearchParams(window.location.search);
      const collection = params.get("collection") || "Photography Collection";
      document.querySelector("#collection-title").textContent = collection;
      const stateGrid = document.querySelector("#states");
      states.forEach((state) => {
        const card = document.createElement("a");
        card.className = "state";
        card.href = `#${state.toLowerCase().replaceAll(" ", "-")}`;
        card.dataset.state = state.toLowerCase();
        card.innerHTML = `<strong>${state}</strong><span>${collection} / State index</span>`;
        stateGrid.append(card);
      });
      const search = document.querySelector("#state-search");
      const count = document.querySelector("#count");
      function filterStates() {
        const query = search.value.toLowerCase();
        let visible = 0;
        document.querySelectorAll(".state").forEach((card) => {
          card.hidden = !card.dataset.state.includes(query);
          if (!card.hidden) visible++;
        });
        count.textContent = `${visible} of 50 states`;
      }
      search.addEventListener("input", filterStates);
      filterStates();
    </script>
  <script src="title-case.js"></script></body>
</html>
